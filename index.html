<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAT Smart Check - ลงทะเบียน</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f7fa;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    .box {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .10);
    }

    h2, .subtitle {
      text-align: center;
    }

    h2 {
      margin: 0 0 8px;
    }

    .subtitle {
      margin: 0 0 20px;
      color: #64748b;
    }

    #status, .profile {
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 8px;
    }

    #status {
      background: #fff7ed;
      color: #9a3412;
      font-weight: bold;
    }

    .profile {
      background: #f1f5f9;
    }

    .success {
      background: #dcfce7 !important;
      color: #166534 !important;
    }

    .error {
      background: #fee2e2 !important;
      color: #b91c1c !important;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #06c755;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      background: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>PAT Smart Check</h2>
    <p class="subtitle">ลงทะเบียนเชื่อมบัญชี LINE</p>

    <div id="status">กำลังเชื่อมต่อ LINE...</div>

    <div class="profile">
      บัญชี LINE: <strong id="displayName">-</strong>
    </div>

    <form id="registerForm">
      <label for="studentId">รหัสนักเรียน</label>

      <input
        id="studentId"
        type="text"
        autocomplete="off"
        placeholder="กรอกรหัสนักเรียน"
        required
      >

      <button id="submitButton" type="submit" disabled>
        ลงทะเบียน
      </button>
    </form>
  </div>

  <script>
    const LIFF_ID = "2011040773-ptaokyCy";

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwVVdW9mnkYyHKdjGJX2Mkl8s6TvMO8gWxRFqjNtFKjEyEcC4IbAOhUTDcTXWH08MiFHw/exec";

    let idToken = "";

    function setStatus(message, type) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.className = type || "";
    }

    async function startLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        const profile = await liff.getProfile();
        idToken = liff.getIDToken();

        if (!idToken) {
          throw new Error("ไม่พบ ID Token");
        }

        document.getElementById("displayName").textContent =
          profile.displayName || "ผู้ใช้ LINE";

        document.getElementById("submitButton").disabled = false;
        setStatus("เชื่อมต่อ LINE สำเร็จ", "success");

      } catch (error) {
        setStatus(
          "เกิดข้อผิดพลาด: " + (error.message || String(error)),
          "error"
        );
      }
    }

    document.getElementById("registerForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const studentId = document.getElementById("studentId").value.trim();
      const button = document.getElementById("submitButton");

      if (!studentId) {
        setStatus("กรุณากรอกรหัสนักเรียน", "error");
        return;
      }

      try {
        button.disabled = true;
        setStatus("กำลังลงทะเบียน...");

        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            idToken: idToken,
            studentId: studentId
          })
        });

        const result = await response.json();

        if (!result.ok) {
          throw new Error(result.message || "ลงทะเบียนไม่สำเร็จ");
        }

        setStatus(result.message, "success");
        document.getElementById("studentId").disabled = true;

      } catch (error) {
        button.disabled = false;
        setStatus(
          "ลงทะเบียนไม่สำเร็จ: " + (error.message || String(error)),
          "error"
        );
      }
    });

    startLiff();
  </script>
</body>
</html>
